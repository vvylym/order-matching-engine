[package]
name = "omer"
description = "An order matching engine implemented in Rust"
version = "0.1.0"
edition = "2024"
autobenches = false
authors = ["Guillaume M. <235853469+vvylym@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/vvylym/order-matching-engine"
documentation = "https://github.com/vvylym/order-matching-engine"
repository = "https://github.com/vvylym/order-matching-engine.git"
keywords = ["order", "matching", "engine"]
categories = ["network", "messaging", "communication"]

[package.metadata.cargo-machete]
# Used only by `benches/*`; machete does not scan bench targets by default.
ignored = ["allocation-counter", "criterion"]

[dependencies]
crossbeam-skiplist = "0.1"
dashmap = "6"
rayon = { version = "1.10", optional = true }
thiserror = "2.0"

[features]
default = ["harness"]
harness = []
parallel = ["dep:rayon"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[dev-dependencies]
allocation-counter = "0.8"
criterion = "0.8"
mockall = "0.14"
quickcheck = "1.0"
quickcheck_macros = "1.1"
proptest = "1.6"
rstest = "0.26"

[[bench]]
name = "itch_parse"
harness = false

[[bench]]
name = "market_manager"
harness = false

[[bench]]
name = "matching_engine"
harness = false

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "latency_add"
harness = false
required-features = ["harness"]

[[bench]]
name = "throughput_book"
harness = false

[[bench]]
name = "throughput_engine"
harness = false
required-features = ["harness"]

[[bench]]
name = "correctness"
harness = false

[[bench]]
name = "latency_cancel"
harness = false
required-features = ["harness"]

[[bench]]
name = "latency_replace"
harness = false
required-features = ["harness"]

[[bench]]
name = "latency_market"
harness = false
required-features = ["harness"]

[[bench]]
name = "throughput_mixed"
harness = false
required-features = ["harness"]

[[bench]]
name = "throughput_adversarial"
harness = false
required-features = ["harness"]

[[bench]]
name = "memory_hot_path"
harness = false

[[bench]]
name = "integrity_stress"
harness = false

[[bench]]
name = "observability_overhead"
harness = false
required-features = ["harness"]

[[bench]]
name = "parallel_best_quotes"
harness = false
required-features = ["parallel"]
